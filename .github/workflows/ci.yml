name: API checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apasbac
          POSTGRES_PASSWORD: apasbac
          POSTGRES_DB: apasbac_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apasbac" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgresql://apasbac:apasbac@localhost:5432/apasbac_test
      - run: npm run openapi:check
      - run: npx eslint "{src,test,scripts}/**/*.ts"
      - run: npx nest build

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
